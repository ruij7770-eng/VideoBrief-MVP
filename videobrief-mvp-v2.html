<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoBrief — 快速理解视频</title>
<style>
:root{--ink:#172328;--mute:#667177;--paper:#f5f4ee;--card:#fffefa;--line:#dfe1d8;--orange:#e9633c;--orange-bg:#ffeadf;--green:#25654f;--green-bg:#e8f2ec;--nav:#132326}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{max-width:1320px;margin:auto;padding:18px 28px 54px}.top{height:44px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px;letter-spacing:-1px}.brand b{color:var(--orange)}.top-right{font-size:12px;color:var(--mute)}.source-form{display:grid;grid-template-columns:1fr 1.15fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin:17px 0 16px}.source-form input,.source-form textarea,.search{border:1px solid var(--line);border-radius:8px;background:#fbfaf6;padding:10px 11px;color:var(--ink)}.source-form textarea{min-height:44px;height:44px;resize:vertical}.primary{background:var(--orange);color:#fff;padding:10px 16px;border-radius:8px;font-weight:800}.primary:hover{background:#c84b29}.outline{background:transparent;border:1px solid var(--line);padding:9px 11px;border-radius:8px;color:var(--ink);font-weight:700}.outline:hover{background:#f5f2eb}.status{font-size:12px;color:var(--green);padding:0 3px 10px;min-height:22px}.empty{border:1px dashed #c8ccc2;border-radius:13px;text-align:center;padding:90px 25px;color:var(--mute)}.empty h1{margin:0 0 8px;color:var(--ink);font-family:Georgia,"Noto Serif SC",serif;font-size:36px;letter-spacing:-1px}.empty button{margin-top:14px}.knowledge{display:none}.knowledge.show{display:block}.hero{background:var(--nav);border-radius:15px;padding:31px 34px;color:#f8f6ef;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:30px}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;color:#f5a080}.hero h1{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(29px,4vw,48px);line-height:1.06;letter-spacing:-.04em;margin:9px 0 14px}.hero p{max-width:740px;color:#d5ddda;margin:0}.player{background:#0c1618;border:1px solid #364346;border-radius:10px;overflow:hidden;min-height:170px;display:flex;align-items:center;justify-content:center;color:#bdc7c4;font-size:13px;text-align:center;padding:20px}.player iframe{width:100%;height:170px;border:0}.player strong{display:block;color:white;font-size:15px;margin-bottom:6px}.read-bar{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 15px 15px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.modes{display:flex;gap:7px}.mode{padding:7px 10px;border-radius:7px;background:transparent;color:var(--mute);font-size:13px;font-weight:800}.mode.active{background:var(--orange-bg);color:#9b391e}.utility{display:flex;gap:8px}.utility button{font-size:13px}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.side{padding:18px 13px;border-right:1px solid var(--line);align-self:stretch}.side-title{font-size:11px;color:var(--mute);font-weight:900;letter-spacing:.12em;margin:0 8px 8px}.search{width:100%;font-size:13px;margin-bottom:10px}.toc button{display:block;text-align:left;width:100%;padding:9px 8px;border-radius:7px;background:transparent;font-size:13px;color:#455156}.toc button:hover,.toc button.active{background:var(--orange-bg);color:#96371e;font-weight:800}.toc time{display:inline-block;width:42px;color:var(--orange);font-weight:900}.article{padding:30px 38px 48px;max-width:1000px}.quick{border-bottom:1px solid var(--line);padding-bottom:25px}.label{font-size:12px;color:var(--orange);font-weight:900;letter-spacing:.1em}.conclusion{font-family:Georgia,"Noto Serif SC",serif;font-size:28px;line-height:1.34;letter-spacing:-.025em;margin:8px 0 17px}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.insight{background:#fbfaf5;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:14px}.insight small{display:block;color:var(--orange);font-weight:900;margin-bottom:3px}.chapter-list{padding-top:28px}.chapter{padding:26px 0;border-bottom:1px solid var(--line);scroll-margin-top:14px}.chapter.hidden{display:none}.chapter-top{display:flex;justify-content:space-between;gap:14px;align-items:center}.chapter-index{font-size:12px;color:var(--orange);font-weight:900;letter-spacing:.1em}.jump{background:var(--orange-bg);color:#9b3a21;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:900}.chapter h2{font-family:Georgia,"Noto Serif SC",serif;font-size:25px;line-height:1.22;letter-spacing:-.02em;margin:8px 0}.takeaway{border-left:3px solid var(--orange);padding:3px 0 3px 12px;font-weight:800;margin:12px 0}.detail{color:#475257;margin:0 0 10px}.detail.compact{display:none}.chapter ul{margin:8px 0;padding-left:20px}.action{margin-top:28px;background:var(--green-bg);border:1px solid #c6dacd;padding:17px;border-radius:10px}.action h3{margin:0 0 8px;font-size:16px}.check{display:flex;gap:8px;margin:7px 0;font-size:14px}.check input{accent-color:var(--green)}.source{font-size:12px;color:var(--mute);margin:13px 0 0;word-break:break-all}@media(max-width:820px){.shell{padding:15px}.source-form{grid-template-columns:1fr}.source-form textarea{height:80px}.hero{grid-template-columns:1fr;padding:26px}.player{min-height:120px}.read-bar{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:12px;position:relative}.toc{display:flex;overflow:auto}.toc button{min-width:max-content}.side-title{display:none}.search{margin:0 0 9px}.article{padding:25px 21px}.insights{grid-template-columns:1fr}.hero h1{font-size:35px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand">Video<b>Brief</b></div><div class="top-right">把视频变成可扫读的理解页面</div></header>
<form class="source-form" id="form"><input id="url" type="url" placeholder="视频链接（可选，支持 YouTube）"><textarea id="transcript" placeholder="粘贴字幕或转写文本；带 [00:00] 时间戳效果最佳"></textarea><button class="primary" type="submit">生成理解页</button></form><div class="status" id="status"><button class="outline" type="button" id="demo">载入示例并体验</button></div>
<section class="empty" id="empty"><h1>视频可以被阅读。</h1><p>先在 30 秒内获得结论；需要时再展开章节和原始证据。</p></section>
<section class="knowledge" id="knowledge"><div class="hero"><div><div class="eyebrow">VIDEO → KNOWLEDGE PAGE</div><h1 id="title">视频知识页</h1><p>按“结论 → 关键洞见 → 章节证据”的顺序阅读。所有章节都保留时间锚点，方便回到原片段验证。</p></div><div class="player" id="player"><div><strong>原视频</strong>输入 YouTube 链接后，可在此处播放。</div></div></div><div class="read-bar"><div class="modes" aria-label="阅读深度"><button class="mode active" data-mode="quick">30 秒结论</button><button class="mode" data-mode="brief">3 分钟理解</button><button class="mode" data-mode="full">完整内容</button></div><div class="utility"><button class="outline" id="copy" type="button">复制 Markdown</button></div></div><div class="layout"><aside class="side"><div class="side-title">定位内容</div><input class="search" id="search" placeholder="搜索视频内容"><nav class="toc" id="toc"></nav></aside><article class="article" id="article"></article></div></section>
</main><script>
const demo=`[00:00] 今天我们用一个实际案例，讲如何在 20 分钟内搭建一个个人知识库。目标不是收集更多信息，而是让信息在需要时可以被找到和使用。
[01:12] 第一部分是建立收集入口。任何灵感、网页和会议笔记都先放进 Inbox，不要在收集时分类。收集和整理是两件不同的事。
[03:28] 接下来定义最少的数据库字段：标题、来源、状态和主题。字段太多会降低录入意愿，先让系统容易使用。
[06:40] 第二部分是处理流程。每天用十分钟清空 Inbox：删除无价值内容、把可行动的内容转成任务、把值得保留的内容写成自己的理解。
[10:15] 模板能减少每次开始时的阻力。阅读笔记模板只保留三个问题：核心观点是什么？它和我已知的什么有关？我下一步会怎么用？
[14:30] 最后是回顾。每周回顾项目和笔记，检查有没有没有推进的任务。知识库不是仓库，它应该持续帮助你做决定。
[18:05] 总结：先建立单一入口，用最少字段降低摩擦，用固定回顾让信息进入行动。`;
const $=s=>document.querySelector(s); let current;
function points(s){return s.split(/[。；！？!?，]/).map(x=>x.trim()).filter(x=>x.length>5).slice(0,3)}
function heading(s,i){let x=s.replace(/^(?:第[一二三四五六七八九十]+部分(?:是)?|接下来|最后|今天|总结)[：:，,]?/,'').trim();return x.length>5?x.slice(0,20):['目标','方法','步骤','复盘'][i]||'关键内容'}
function parse(text){const rows=text.trim().split(/\n+/).map((line,i)=>{const m=line.match(/\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s*(.*)/);return{time:m?m[1]:`${String(i*2).padStart(2,'0')}:00`,body:(m?m[2]:line).trim()}}).filter(r=>r.body);const hit=text.match(/如何([^。！？!?\n]{2,28})/);return{title:hit?hit[1].replace(/[，,].*$/,'').trim():'视频知识页',summary:(rows.at(-1)?.body||'从视频中提取关键结论。').replace(/^总结[：:]/,''),chapters:rows.map((r,i)=>({...r,title:heading(r.body,i),points:points(r.body)}))}}
function ytEmbed(url){try{const u=new URL(url);let id=u.searchParams.get('v')|| (u.hostname.includes('youtu.be')?u.pathname.slice(1):'');return id?`https://www.youtube-nocookie.com/embed/${id}`:''}catch{return ''}}
function render(data,url){current={data,url};$('#title').textContent=data.title;const embed=ytEmbed(url);$('#player').innerHTML=embed?`<iframe src="${embed}" title="原视频" allowfullscreen></iframe>`:'<div><strong>阅读优先</strong>这份页面保留时间锚点；可随时回到原视频验证。</div>';const toc=$('#toc');toc.innerHTML='<button class="active" data-id="quick"><time>总览</time>快速理解</button>'+data.chapters.map((c,i)=>`<button data-id="chapter-${i}"><time>${c.time}</time>${c.title}</button>`).join('');const insights=data.chapters.slice(0,3).map((c,i)=>`<div class="insight"><small>洞见 0${i+1}</small>${c.points[0]||c.body}</div>`).join('');const chapters=data.chapters.map((c,i)=>`<section class="chapter" id="chapter-${i}" data-search="${(c.title+c.body+c.points.join(' ')).toLowerCase()}"><div class="chapter-top"><span class="chapter-index">${String(i+1).padStart(2,'0')} · ${c.time}</span><button class="jump" data-time="${c.time}">回到原片段</button></div><h2>${c.title}</h2><div class="takeaway">${c.points[0]||c.body}</div><p class="detail">${c.body}</p><ul class="detail">${c.points.slice(1).map(p=>`<li>${p}</li>`).join('')}</ul></section>`).join('');$('#article').innerHTML=`<section class="quick" id="quick"><div class="label">30 秒结论</div><div class="conclusion">${data.summary}</div><div class="insights">${insights}</div></section><section class="chapter-list" id="chapter-list"><div class="label">按需展开：每节只保留一个结论、一段解释和时间证据</div>${chapters}</section><section class="action"><h3>把理解变为行动</h3>${data.chapters.slice(0,3).map(c=>`<label class="check"><input type="checkbox">把「${c.title}」转成下一步</label>`).join('')}<p class="source">来源：${url||'用户粘贴的字幕 / 转写文本'}</p></section>`;$('#knowledge').classList.add('show');$('#empty').style.display='none';setMode('quick');toc.querySelectorAll('button').forEach(b=>b.onclick=()=>{$$('.toc .active')?.classList.remove('active');b.classList.add('active');$('#'+b.dataset.id).scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('.jump').forEach(b=>b.onclick=()=>openVideo(url,b.dataset.time));}
function setMode(mode){document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));const chapters=[...document.querySelectorAll('.chapter')], actions=$('.action');if(!chapters.length)return;chapters.forEach((x,i)=>{x.classList.toggle('hidden',mode==='quick'||(mode==='brief'&&i>2));x.querySelectorAll('.detail').forEach(d=>d.classList.toggle('compact',mode==='brief'))});actions.style.display=mode==='quick'?'none':'block';$('#chapter-list').style.display=mode==='quick'?'none':'block'}
function openVideo(url,time){const e=ytEmbed(url);if(!e){alert('请先填写 YouTube 视频链接；生产版也会支持其他平台。');return}const [m,s]=time.split(':').map(Number);$('#player iframe').src=e+'?start='+(m*60+s);$('#player').scrollIntoView({behavior:'smooth',block:'center'})}
$('#form').onsubmit=e=>{e.preventDefault();const text=$('#transcript').value.trim();if(!text){$('#status').textContent='请粘贴字幕/转写文本，或点击“载入示例并体验”。';return}$('#status').textContent='已生成：先看结论，再按需深入。';render(parse(text),$('#url').value.trim())};$('#demo').onclick=()=>{$('#url').value='';$('#transcript').value=demo;$('#form').requestSubmit()};document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#search').oninput=e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('.chapter').forEach(c=>c.classList.toggle('hidden',q&&!c.dataset.search.includes(q)))};$('#copy').onclick=async()=>{if(!current)return;const d=current.data;const md=`# ${d.title}\n\n## 30 秒结论\n${d.summary}\n\n`+d.chapters.map(c=>`## ${c.time} ${c.title}\n${c.body}\n\n- ${c.points.join('\n- ')}`).join('\n\n');await navigator.clipboard.writeText(md);$('#copy').textContent='已复制';setTimeout(()=>$('#copy').textContent='复制 Markdown',1200)};
</script></body></html>
