<html lang="zh-CN">
<head>

<title>VideoBrief — 快速理解视频</title>
<style>
:root{--ink:#111513;--muted:#68706c;--line:rgba(17,21,19,.09);--soft:#f6f8f6;--green:#16c784;--green-deep:#087a4e;--green-soft:#e4f8ef;--amber:#b86b11;--amber-soft:#fff4de;--white:#fff;--shadow:0 2px 12px rgba(15,25,20,.04)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font:15px/1.65 Inter,"Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);z-index:20}.brand{font-size:20px;font-weight:700;letter-spacing:-.5px}.brand i{font-style:normal;color:var(--green-deep)}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:600}.btn:hover{border-color:rgba(17,21,19,.2)}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn:disabled{opacity:.42;cursor:not-allowed}.create{max-width:1120px;margin:30px auto;padding:0 24px}.create-box{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;padding:34px;background:linear-gradient(135deg,#fff 35%,#eefbf5);box-shadow:var(--shadow)}.create h1{font-size:38px;line-height:1.12;letter-spacing:-1.2px;margin:0 0 9px}.create-lead{color:var(--muted);font-size:17px;margin:0 0 25px}.inputs{display:grid;grid-template-columns:1fr 1fr auto;gap:9px}.inputs input,.inputs textarea,.ask-form input,.search{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;outline:none}.inputs input:focus,.inputs textarea:focus,.ask-form input:focus,.search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,199,132,.12)}.inputs textarea{height:48px;resize:vertical}.extras{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.extras input[type=file]{max-width:250px}.extras select{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff}.status{display:none;margin-top:18px}.status.show{display:block}.status-line{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:7px}.track{height:7px;background:#e8eee9;border-radius:9px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--green);transition:width .35s}.create.compact{margin-top:14px;margin-bottom:0}.create.compact .create-box{padding:16px 20px;border-radius:16px}.create.compact h1,.create.compact .create-lead{display:none}.create.compact .inputs{grid-template-columns:1fr 1fr auto}.shell{display:none;max-width:1440px;margin:20px auto 70px;padding:0 24px;grid-template-columns:210px minmax(0,760px) 300px;gap:26px}.shell.show{display:grid}.rail{position:sticky;top:84px;height:calc(100vh - 104px);overflow:auto}.rail-label,.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:#7c8580}.rail nav{margin:10px 0 26px}.rail nav button,.history button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:8px 10px;color:var(--muted)}.rail nav button:hover,.rail nav button.active{background:var(--soft);color:var(--ink)}.history{border-top:1px solid var(--line);padding-top:18px}.history button{border-bottom:1px solid var(--line);border-radius:0;padding:10px 4px}.history span,.history time{display:block}.history span{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history time{font-size:11px;margin-top:2px}.main{min-width:0}.hero{padding:28px 0 34px;border-bottom:1px solid var(--line)}.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--green-soft);color:var(--green-deep);font-size:12px;font-weight:700}.pill.off{background:var(--amber-soft);color:var(--amber)}.hero h1{font-size:42px;line-height:1.12;letter-spacing:-1.4px;margin:17px 0 14px}.summary{font-size:21px;line-height:1.55;color:#303733}.metrics{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap}.metric b,.metric span{display:block}.metric b{font-size:17px}.metric span{font-size:12px;color:var(--muted)}.engine{margin-top:17px;color:var(--muted);font-size:12px}.section{padding:35px 0;border-bottom:1px solid var(--line);scroll-margin-top:80px}.section-title{font-size:25px;letter-spacing:-.5px;margin:0 0 6px}.section-lead{margin:0 0 20px;color:var(--muted)}.quick-brief{border:1px solid #bde7d3;background:linear-gradient(145deg,#f4fcf8,#fff);border-radius:20px;padding:22px}.quick-question{font-size:13px;color:var(--green-deep);font-weight:700}.quick-answer{font-size:24px;line-height:1.45;margin:7px 0 18px;letter-spacing:-.3px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.quick-item span,.quick-item b{display:block}.quick-item span{font-size:11px;color:var(--muted);margin-bottom:3px}.claim-meta{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)}.claim-tag{background:var(--soft);border-radius:999px;padding:2px 7px}.fingerprint{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fp{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.fp span,.fp b{display:block}.fp span{font-size:12px;color:var(--muted)}.fp b{font-size:16px;margin-top:4px}.insights{display:grid;gap:10px}.insight{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:16px;padding:17px}.insight .num{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--green-soft);color:var(--green-deep);font-weight:700}.insight h3{font-size:16px;margin:1px 0 3px}.insight p{margin:0;color:var(--muted)}.time-btn{border:0;background:none;color:var(--green-deep);font-weight:700;padding:4px}.map{display:flex;flex-direction:column;margin-top:20px}.map-node{display:grid;grid-template-columns:80px 24px 1fr;align-items:center;min-height:62px}.map-kind{font-size:12px;font-weight:700;color:var(--muted);text-align:right}.map-line{height:100%;position:relative}.map-line:before{content:"";position:absolute;left:11px;top:0;bottom:0;width:1px;background:#cfe4d8}.map-line:after{content:"";position:absolute;left:7px;top:25px;width:9px;height:9px;border-radius:50%;background:var(--green)}.map-text{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin:5px 0}.watch{display:grid;gap:10px}.watch-card{background:var(--amber-soft);border:1px solid #f2d9ad;border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:8px}.watch-card b,.watch-card span{display:block}.watch-card span{color:#7b633e;font-size:13px;margin-top:4px}.chapter{padding:28px 0;border-bottom:1px solid var(--line);scroll-margin-top:80px}.chapter-head{display:flex;justify-content:space-between;color:var(--green-deep);font-size:12px;font-weight:700}.chapter h2{font-size:25px;line-height:1.3;margin:9px 0}.takeaway{font-size:17px;font-weight:600;margin-bottom:10px}.chapter-body{color:#434b47;font-size:16px;line-height:1.85}.evidence{margin-top:15px;border-left:3px solid var(--green);background:var(--soft);border-radius:0 12px 12px 0;padding:4px 14px}.evidence summary{cursor:pointer;padding:8px 0;font-weight:600}.quote{padding:8px 0;border-top:1px solid var(--line);color:#4c5651}.hidden{display:none!important}.right-card{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;background:#fff;box-shadow:var(--shadow)}.right-card h3{font-size:16px;margin:0 0 5px}.right-card p{color:var(--muted);font-size:13px;margin:0 0 12px}.ask-form{display:flex;gap:7px}.ask-form input{min-width:0;width:100%}.ask-answer{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}.ask-answer.show{display:block}.ask-answer p{color:var(--ink);font-size:14px}.ask-answer blockquote{margin:8px 0;padding-left:10px;border-left:2px solid var(--green);font-size:12px;color:var(--muted)}.search{width:100%;margin-top:8px}.search-count{font-size:12px;color:var(--muted);margin-top:6px}.side-stat{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0}.side-stat:first-of-type{margin-top:10px}.side-stat span{color:var(--muted)}.mobile-tabs{display:none}.empty{max-width:960px;margin:80px auto;text-align:center;padding:0 24px}.empty h2{font-size:34px;margin:0 0 8px}.empty p{color:var(--muted)}
.hero-labels{display:flex;gap:7px;flex-wrap:wrap}.pill.neutral{background:var(--soft);color:#55605a}.decision h1{font-size:36px;line-height:1.16;margin:16px 0 20px}.decision-kicker{font-size:13px;font-weight:700;color:var(--green-deep);margin-bottom:5px}.decision-answer{font-size:24px;line-height:1.48;font-weight:650;letter-spacing:-.25px}.decision-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.decision-cell{border:1px solid var(--line);background:var(--soft);border-radius:13px;padding:13px}.decision-cell span,.decision-cell b{display:block}.decision-cell span{font-size:11px;color:var(--muted);margin-bottom:3px}.decision-cell b{font-size:14px;line-height:1.55}.decision-evidence{margin-top:18px}.decision .metrics{padding-top:18px;border-top:1px solid var(--line)}
.type-model{display:grid;gap:12px}.type-group{border-left:3px solid var(--green);padding:4px 0 4px 18px}.type-group h3{font-size:13px;letter-spacing:.08em;color:var(--green-deep);margin:0 0 8px}.type-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.type-item:last-child{border-bottom:0}.type-item b{display:block;font-size:16px;margin-bottom:3px}.type-item p{margin:0;color:#38413d}.type-proof{grid-column:1/-1;margin-top:2px}
@media(max-width:1120px){.shell{grid-template-columns:180px minmax(0,1fr)}.right{grid-column:2}.right .rail{position:static;height:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}}
@media(max-width:760px){.topbar{padding:0 14px}.create{padding:0 12px}.create-box{padding:23px}.create h1{font-size:30px}.inputs,.create.compact .inputs{grid-template-columns:1fr}.shell,.shell.show{padding:0 16px;display:block}.left{display:none}.right{margin-top:20px}.right .rail{display:block}.hero h1{font-size:32px}.summary{font-size:18px}.fingerprint,.quick-grid,.decision-grid{grid-template-columns:1fr}.decision-answer{font-size:20px}.mobile-tabs{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:64px;background:#fff;z-index:10}.mobile-tabs button{white-space:nowrap}.insight{grid-template-columns:34px 1fr}.insight .time-btn{grid-column:2}.top-actions #newBtn{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">Video<i>Brief</i></div><div class="top-actions"><button id="newBtn" class="btn">新建解析</button><button id="exportBtn" class="btn" disabled>导出 HTML</button></div></header>
<section id="create" class="create"><div class="create-box"><h1>不必完整观看，也能准确理解</h1><p class="create-lead">先判断价值，再看内容地图；只有依赖画面的片段才需要回到原视频。</p><form id="form" class="inputs"><input id="url" type="url" placeholder="粘贴 Bilibili / YouTube 链接"><textarea id="transcript" placeholder="或粘贴带时间戳的字幕"></textarea><button id="submit" class="btn primary">开始理解</button></form><div class="extras"><input id="file" type="file" accept="video/*,audio/*"><select id="model" title="语音识别质量"><option value="tiny">极速转写</option><option value="small">平衡转写</option><option value="medium">高质量转写</option></select><select id="analysis" title="内容分析模式"><option value="auto">自动选择分析引擎</option><option value="fast">本地极速分析</option><option value="smart">DeepSeek 智能分析</option></select><span id="agentState" class="pill">正在检查智能分析…</span><button id="demo" class="btn" type="button">查看示例</button></div><div id="status" class="status"><div class="status-line"><span id="statusText"></span><b id="percent">0%</b></div><div class="track"><i id="progress"></i></div></div></div></section>
<section id="empty" class="empty"><h2>把线性视频，变成可跳读的理解地图</h2><p>视频知识指纹 · 核心观点 · 必看片段 · 章节证据 · 视频内问答</p></section>
<div id="shell" class="shell"><aside class="left rail"><div class="rail-label">快速导航</div><nav id="nav"></nav><div class="history"><div class="rail-label">最近生成</div><div id="historyList"></div></div></aside><main id="main" class="main"></main><aside class="right"><div class="rail"><section class="right-card"><h3>问这个视频</h3><p>只依据视频内容回答；找不到证据时会明确说明。</p><form id="askForm" class="ask-form"><input id="question" placeholder="例如：作者为什么这样做？"><button class="btn primary">提问</button></form><div id="askAnswer" class="ask-answer"></div></section><section class="right-card"><h3>在内容中查找</h3><input id="search" class="search" placeholder="搜索章节或字幕证据"><div id="searchCount" class="search-count"></div></section><section id="sideStats" class="right-card"></section></div></aside></div>
<script>
const $=s=>document.querySelector(s), el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const demo=`[00:00] 今天演示如何在二十分钟内搭建个人知识库，解决信息散落和收藏后不再使用的问题。\n[01:12] 第一步建立唯一的收集入口。灵感、网页和会议笔记都先放进收件箱。\n[03:28] 现在看屏幕演示，点击新建数据库，只保留标题、来源、状态和主题四个字段。字段太多会增加录入阻力。\n[06:40] 第二部分是处理流程。每天花十分钟清空收件箱，把信息放进项目或资料库。\n[10:15] 阅读笔记模板只保留三个问题，复杂模板会降低记录意愿。\n[14:30] 最后是回顾。每周检查没有推进的任务，让信息真正进入行动。\n[18:05] 总结：先建立单一入口，用最少字段降低摩擦，再用固定回顾维持系统。`;
let current=null,currentUrl='';
function fmt(sec){sec=Number(sec)||0;const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function setStatus(show,pct,text){$('#status').classList.toggle('show',show);$('#progress').style.width=`${pct}%`;$('#percent').textContent=`${pct}%`;$('#statusText').textContent=text}
async function api(url,opt){const r=await fetch(url,opt);let data;try{data=await r.json()}catch{throw new Error('服务器返回了无法解析的响应')}if(!r.ok)throw new Error(data.detail||data.error||'请求失败');return data}
async function poll(id){for(;;){await new Promise(r=>setTimeout(r,700));const job=await api(`/api/jobs/${id}`);setStatus(true,job.progress,job.message);if(job.status==='completed'){render(job.result);loadHistory();return}if(job.status==='failed')throw new Error(job.error||'处理失败')}}
$('#form').onsubmit=async e=>{e.preventDefault();const file=$('#file').files[0],url=$('#url').value.trim(),transcript=$('#transcript').value.trim(),analysis_mode=$('#analysis').value;if(!file&&!url&&!transcript){setStatus(true,0,'请提供链接、字幕或本地文件');return}$('#submit').disabled=true;try{setStatus(true,5,'正在创建任务');let job;if(file){const fd=new FormData();fd.append('media',file);job=await api(`/api/jobs/upload?model_size=${$('#model').value}&analysis_mode=${analysis_mode}`,{method:'POST',body:fd});currentUrl=''}else{job=await api('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,transcript,analysis_mode})});currentUrl=url}await poll(job.id)}catch(err){setStatus(true,0,`处理失败：${err.message}`)}finally{$('#submit').disabled=false}};
$('#demo').onclick=()=>{$('#url').value='';$('#file').value='';$('#transcript').value=demo;$('#form').requestSubmit()};
$('#newBtn').onclick=()=>{$('#create').classList.remove('compact');$('#url').focus();window.scrollTo({top:0,behavior:'smooth'})};
function jump(seconds){if(!currentUrl){alert(`请在原视频 ${fmt(seconds)} 查看对应片段。`);return}try{const u=new URL(currentUrl);u.searchParams.set('t',u.hostname.includes('youtube')||u.hostname.includes('youtu.be')?`${seconds}s`:seconds);window.open(u.toString(),'_blank','noopener')}catch{}}
function section(id,title,lead){const s=el('section','section');s.id=id;s.append(el('h2','section-title',title));if(lead)s.append(el('p','section-lead',lead));return s}
const modelViews={tutorial:{title:'操作路线',lead:'按目标、前置条件、步骤、参数、避坑和结果重组教程。',roles:{goal:'目标',prerequisite:'前置条件',step:'操作步骤',parameter:'参数与设置',pitfall:'容易出错',result:'完成结果'}},interview:{title:'观点与分歧',lead:'按议题、人物立场、论据和未决问题重组访谈。',roles:{topic:'核心议题',speaker_position:'人物立场',argument:'主要论据',disagreement:'观点分歧',key_quote:'关键原话',open_question:'未决问题'}},review:{title:'评测结论矩阵',lead:'按评测对象、标准、优缺点和取舍重组评测。',roles:{subject:'评测对象',criterion:'比较标准',pro:'优点',con:'缺点',tradeoff:'取舍',verdict:'最终判断'}},lecture:{title:'概念与推理',lead:'按核心问题、概念关系、案例和结论重组知识讲解。',roles:{central_question:'核心问题',concept:'关键概念',relationship:'概念关系',example:'案例',conclusion:'结论',boundary:'适用边界'}},commentary:{title:'事实与观点边界',lead:'明确区分事实、观点、推断、争议和不确定性。',roles:{topic:'讨论主题',fact:'事实',opinion:'作者观点',inference:'推断',controversy:'争议',uncertainty:'不确定性'}}};
function renderContentModel(data,main){const model=data.content_model,view=modelViews[model?.template];if(!view||!(model.items||[]).length)return;const s=section('type-model',view.title,view.lead),wrap=el('div','type-model'),groups={};model.items.forEach(item=>(groups[item.role]??=[]).push(item));Object.keys(view.roles).forEach(role=>{if(!groups[role])return;const group=el('div','type-group');group.append(el('h3','',view.roles[role]));groups[role].forEach(item=>{const row=el('article','type-item'),body=el('div');body.append(el('b','',item.title),el('p','',item.detail));const go=el('button','time-btn',item.time);go.onclick=()=>jump(item.seconds);row.append(body,go);const proof=el('details','evidence type-proof');proof.append(el('summary','',`核对证据 · ${(item.evidence_ids||[]).join('、')}`));(item.evidence||[]).forEach(v=>{const quote=el('div','quote'),at=el('button','time-btn',`[${v.time}]`);at.onclick=()=>jump(v.seconds);quote.append(at,document.createTextNode(` ${v.quote}`));proof.append(quote)});row.append(proof);group.append(row)});wrap.append(group)});s.append(wrap);main.append(s)}
function renderDecisionHero(data,main){
 const hero=el('section','hero decision');hero.id='overview';
 const labels=el('div','hero-labels');labels.append(el('span','pill',data.fingerprint?.type_label||'视频内容'),el('span','pill neutral',`${data.fingerprint?.information_density||'未知'}信息密度`),el('span','pill neutral',`原视频 ${fmt(data.metrics?.duration_seconds)}`));hero.append(labels,el('h1','',data.title));
 const q=data.quick_brief;if(q)hero.append(el('div','decision-kicker',q.central_question),el('div','decision-answer',q.direct_answer));else hero.append(el('div','decision-answer',data.summary));
 if(q){const context=el('div','decision-grid');[['为什么重要',q.why_it_matters],['视频边界',q.limitation]].forEach(([label,value])=>{const cell=el('div','decision-cell');cell.append(el('span','',label),el('b','',value));context.append(cell)});hero.append(context)}
 const duration=data.metrics?.duration_seconds||0,read=(data.metrics?.estimated_read_minutes||1)*60,watch=(data.must_watch_segments||[]).reduce((n,s)=>n+Math.max(0,s.end_seconds-s.start_seconds),0),saved=Math.max(0,duration-read-watch),metrics=el('div','metrics');[[fmt(read),'预计阅读'],[fmt(watch),'需看原片'],[fmt(saved),'预计节省'],[data.metrics?.evidence_count||0,'可核对证据']].forEach(([v,l])=>{const m=el('div','metric');m.append(el('b','',v),el('span','',l));metrics.append(m)});hero.append(metrics);
 if(q?.evidence?.length){const proof=el('details','evidence decision-evidence');proof.append(el('summary','',`核对直接答案 · ${(q.evidence_ids||[]).join('、')}`));q.evidence.forEach(v=>{const row=el('div','quote'),go=el('button','time-btn',`[${v.time}]`);go.onclick=()=>jump(v.seconds);row.append(go,document.createTextNode(` ${v.quote}`));proof.append(row)});hero.append(proof)}
 const agentText=data.agent?.mode==='smart'?`DeepSeek 已完成“分析→证据审计”，展示 ${data.agent.validated_insights||0} 条观点和 ${data.agent.validated_structure_items||0} 条类型化内容；剔除 ${(data.agent.rejected_insights||0)+(data.agent.rejected_structure_items||0)} 条无效表述；审计可信度 ${data.agent.audit_confidence||'—'}。${data.agent.structure_fallback?' 智能类型结构不足，已保留完整本地结构。':''}`:'当前使用本地规则引擎；未配置或未选择智能分析时自动安全降级。';hero.append(el('div','engine',agentText));main.append(hero)
}
function render(data){current=data;currentUrl=data.url||currentUrl;$('#empty').style.display='none';$('#shell').classList.add('show');$('#create').classList.add('compact');$('#exportBtn').disabled=false;const main=$('#main');main.replaceChildren();renderDecisionHero(data,main);
renderContentModel(data,main);
const insightSec=section('insights','核心观点','每条观点都可展开核对精确字幕证据。'),insights=el('div','insights'),claimLabels={video_explicit:'视频明确表达',contextual_summary:'上下文概括',system_inference:'系统推断'},auditLabels={supported:'证据审计通过',partial:'审计后已收窄表述',deterministic:'本地规则提取'};(data.key_insights||[]).forEach((x,i)=>{const card=el('article','insight');card.append(el('div','num',String(i+1).padStart(2,'0')));const text=el('div');text.append(el('h3','',x.title),el('p','',x.detail));const meta=el('div','claim-meta');meta.append(el('span','claim-tag',claimLabels[x.claim_type]||'上下文概括'),el('span','',auditLabels[x.audit_status]||'证据状态未知'));text.append(meta);if((x.evidence||[]).length){const proof=el('details','evidence');proof.append(el('summary','',`核对证据 · ${(x.evidence_ids||[]).join('、')}`));x.evidence.forEach(v=>{const row=el('div','quote');const go=el('button','time-btn',`[${v.time}]`);go.onclick=()=>jump(v.seconds);row.append(go,document.createTextNode(` ${v.quote}`));proof.append(row)});text.append(proof)}const time=el('button','time-btn',x.time);time.onclick=()=>jump(x.seconds);card.append(text,time);insights.append(card)});insightSec.append(insights);main.append(insightSec);
const mapSec=section('map','内容逻辑图','把线性叙述还原为问题、要点和结论。'),map=el('div','map');(data.content_map||[]).forEach(x=>{const n=el('div','map-node');n.append(el('div','map-kind',x.kind),el('div','map-line'),el('div','map-text',`${x.title} · ${x.time}`));map.append(n)});mapSec.append(map);main.append(mapSec);
const watchSec=section('watch','哪些部分值得回到视频','只保留依赖画面或实际操作的片段。'),watch=el('div','watch');if((data.must_watch_segments||[]).length){data.must_watch_segments.forEach(x=>{const c=el('article','watch-card'),t=el('div');t.append(el('b','',`${x.time}—${fmt(x.end_seconds)} · ${x.preview}`),el('span','',x.reason));const b=el('button','btn','查看片段');b.onclick=()=>jump(x.start_seconds);c.append(t,b);watch.append(c)})}else watch.append(el('p','section-lead','没有检测到必须依赖画面的片段，这份内容适合直接阅读。'));watchSec.append(watch);main.append(watchSec);
const deep=section('chapters','按需深入','展开章节正文，并随时核对字幕证据。');(data.chapters||[]).forEach((c,i)=>{const a=el('article','chapter');a.dataset.search=[c.title,c.body,...(c.points||[]),...(c.evidence||[]).map(e=>e.quote)].join(' ').toLowerCase();const head=el('div','chapter-head');head.append(el('span','',`${String(i+1).padStart(2,'0')} · ${c.time}—${fmt(c.end_seconds)}`));const b=el('button','time-btn','查看原片段');b.onclick=()=>jump(c.start_seconds);head.append(b);a.append(head,el('h2','',c.title),el('div','takeaway',c.points?.[0]||c.body),el('div','chapter-body',c.body));const ev=el('details','evidence');ev.append(el('summary','','核对字幕证据'));(c.evidence||[]).forEach(q=>{const row=el('div','quote'),go=el('button','time-btn',`${q.evidence_id||'证据'} · ${q.time}`);go.onclick=()=>jump(q.seconds);row.append(go,document.createTextNode(` ${q.quote}`));ev.append(row)});a.append(ev);deep.append(a)});main.append(deep);renderNav(data);renderStats(data);window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(data){const nav=$('#nav');nav.replaceChildren();const items=[['overview','快速判断']];if(data?.content_model?.items?.length)items.push(['type-model',modelViews[data.content_model.template]?.title||'内容结构']);items.push(['insights','核心观点'],['map','内容地图'],['watch','必看片段'],['chapters','按需深入']);items.forEach(([id,t])=>{const b=el('button','',t);b.onclick=()=>document.getElementById(id)?.scrollIntoView();nav.append(b)})}
function renderStats(d){const x=$('#sideStats');x.replaceChildren(el('h3','','理解节省'));const duration=d.metrics?.duration_seconds||0,read=(d.metrics?.estimated_read_minutes||1)*60,watch=(d.must_watch_segments||[]).reduce((n,s)=>n+Math.max(0,s.end_seconds-s.start_seconds),0);[['原视频',fmt(duration)],['预计阅读',fmt(read)],['必须观看',fmt(watch)],['预计节省',fmt(Math.max(0,duration-read-watch))]].forEach(([l,v])=>{const r=el('div','side-stat');r.append(el('span','',l),el('b','',v));x.append(r)})}
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();let count=0;document.querySelectorAll('.chapter').forEach(x=>{const hit=!q||x.dataset.search.includes(q);x.classList.toggle('hidden',!hit);if(hit&&q)count++});$('#searchCount').textContent=q?`找到 ${count} 个相关章节`:''};
$('#askForm').onsubmit=async e=>{e.preventDefault();const q=$('#question').value.trim(),box=$('#askAnswer');if(!q||!current?.brief_id)return;box.classList.add('show');box.replaceChildren(el('p','','正在视频内容中查找证据……'));try{const a=await api(`/api/briefs/${current.brief_id}/ask`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});box.replaceChildren(el('p','',a.answer));if(a.found){const go=el('button','time-btn',`${a.time} · 查看对应章节`);go.onclick=()=>jump(a.seconds);box.append(go);(a.evidence||[]).slice(0,2).forEach(v=>box.append(el('blockquote','',`[${v.evidence_id||'证据'} · ${v.time}] ${v.quote}`)))}}catch(err){box.replaceChildren(el('p','',`提问失败：${err.message}`))}};
async function loadHistory(){try{const rows=await api('/api/history'),list=$('#historyList');list.replaceChildren();rows.slice(0,10).forEach(row=>{const b=el('button');b.append(el('span','',row.title),el('time','',new Date(row.created_at).toLocaleString('zh-CN')));b.onclick=async()=>{currentUrl=row.url||'';render(await api(`/api/history/${row.id}`))};list.append(b)});if(!rows.length)list.append(el('p','section-lead','还没有历史记录'))}catch{}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#exportBtn').onclick=()=>{if(!current)return;const d=current,typed=(d.content_model?.items||[]).map(x=>`<section><small>${escapeHtml(modelViews[d.content_model.template]?.roles[x.role]||x.role)} · ${escapeHtml(x.time)}</small><h2>${escapeHtml(x.title)}</h2><p>${escapeHtml(x.detail)}</p>${(x.evidence||[]).map(e=>`<blockquote><b>${escapeHtml(e.evidence_id)} · ${escapeHtml(e.time)}</b><br>${escapeHtml(e.quote)}</blockquote>`).join('')}</section>`).join(''),insights=(d.key_insights||[]).map(x=>`<li><b>${escapeHtml(x.title)}</b><br>${escapeHtml(x.detail)}${(x.evidence||[]).map(e=>`<blockquote><b>${escapeHtml(e.evidence_id)} · ${escapeHtml(e.time)}</b><br>${escapeHtml(e.quote)}</blockquote>`).join('')}</li>`).join(''),chapters=(d.chapters||[]).map(c=>`<section><small>${escapeHtml(c.time)}</small><h2>${escapeHtml(c.title)}</h2><p>${escapeHtml(c.body)}</p>${(c.evidence||[]).map(e=>`<blockquote>[${escapeHtml(e.time)}] ${escapeHtml(e.quote)}</blockquote>`).join('')}</section>`).join('');const html=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${escapeHtml(d.title)}</title><style>body{max-width:820px;margin:40px auto;padding:0 20px;font:16px/1.75 sans-serif;color:#151917}header{padding:32px;background:#e9f9f1;border-radius:20px}section{padding:25px 0;border-bottom:1px solid #ddd}blockquote{background:#f5f7f5;border-left:3px solid #16c784;padding:10px 14px;margin:10px 0}</style><header><h1>${escapeHtml(d.title)}</h1><p>${escapeHtml(d.summary)}</p></header>${typed?`<h2>${escapeHtml(modelViews[d.content_model.template]?.title||'内容结构')}</h2>${typed}`:''}<h2>核心观点</h2><ol>${insights}</ol>${chapters}</html>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download=`${d.title.replace(/[\\/:*?"<>|]/g,'-')}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
async function loadAgentStatus(){const badge=$('#agentState'),smart=[...$('#analysis').options].find(x=>x.value==='smart');try{const s=await api('/api/agent/status');if(s.configured){badge.textContent=`${s.provider} · ${s.model} 已连接`;badge.classList.remove('off');smart.disabled=false}else{badge.textContent='DeepSeek 尚未配置';badge.classList.add('off');smart.disabled=true;smart.title='请先配置 VIDEOBRIEF_LLM_API_KEY'}}catch{badge.textContent='智能分析状态不可用';badge.classList.add('off');smart.disabled=true}}
loadAgentStatus();
loadHistory();
</script>
